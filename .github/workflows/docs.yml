name: Documentation

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check license headers and public contracts
        run: |
          python3 tools/check_license_headers.py
          python3 tools/check_public_contracts.py
          python3 tools/check_input_provenance.py

      - name: Install Doxygen
        run: |
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install --no-install-recommends -y doxygen graphviz

      - name: Build documentation
        run: |
          mkdir -p build/doxygen
          version="$(sed -n 's/^project(libmimusb VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)"
          test -n "$version"
          { cat tools/docs/Doxyfile; echo "PROJECT_NUMBER = $version"; } | doxygen -
          test -s build/doxygen/html/index.html

      - name: Upload Pages artifact
        if: vars.MIMUSB_DEPLOY_PAGES == 'true' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: build/doxygen/html

  deploy:
    needs: build
    if: vars.MIMUSB_DEPLOY_PAGES == 'true' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
