[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mimusb"
version = "0.6.1"
description = "Explicit ctypes bindings for libmimusb"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]

[project.urls]
Homepage = "https://github.com/nemarpuc/libmimusb"
Repository = "https://github.com/nemarpuc/libmimusb"
Issues = "https://github.com/nemarpuc/libmimusb/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
